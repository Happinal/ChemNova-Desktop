<script>
let volumeBase = 0;
let equivalencePoint = 20;
let ph = 1;

function showSection(id) {
  document.querySelectorAll('.section').forEach(sec => sec.style.display="none");
  document.getElementById(id).style.display="block";
}

function addDrop() {
  volumeBase += 1;

  if (volumeBase < equivalencePoint) {
    ph = 1 + (volumeBase * 0.15);
  } 
  else if (volumeBase === equivalencePoint) {
    ph = 7;
  } 
  else {
    ph = 7 + ((volumeBase - equivalencePoint) * 0.3);
  }

  if (ph > 14) ph = 14;

  document.getElementById("phValue").innerText = "pH: " + ph.toFixed(2);

  if (ph > 8) {
    document.getElementById("flask").style.background = "pink";
  }
}

function reset() {
  volumeBase = 0;
  ph = 1;
  document.getElementById("phValue").innerText = "pH: 1";
  document.getElementById("flask").style.background = "red";
}
</script>
