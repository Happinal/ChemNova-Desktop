<!DOCTYPE html>
<html>
<head>
  <title>ChemNova Virtual Chemistry</title>
  <style>
    body {
      font-family: Arial;
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 { color: #38bdf8; }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background: #22d3ee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #flask {
      width: 120px;
      height: 150px;
      margin: 20px auto;
      background: red;
      border-radius: 0 0 60px 60px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<h1>ChemNova Virtual Chemistry Lab</h1>

<button onclick="startExperiment()">Start Titration</button>

<div id="lab" class="hidden">
  <h2>Acid-Base Titration</h2>
  <div id="flask"></div>
  <p id="phValue">pH: 1</p>
  <button onclick="addDrop()">Add NaOH Drop</button>
  <button onclick="reset()">Reset</button>
</div>

<script>
let ph = 1;

function startExperiment() {
  document.getElementById("lab").classList.remove("hidden");
}

function addDrop() {
  if (ph < 14) {
    ph += 0.5;
    document.getElementById("phValue").innerText = "pH: " + ph.toFixed(1);

    if (ph > 8) {
      document.getElementById("flask").style.background = "pink";
    }
  }
}

function reset() {
  ph = 1;
  document.getElementById("phValue").innerText = "pH: 1";
  document.getElementById("flask").style.background = "red";
}
</script>

</body>
</html>
