<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChemNova 3D Engine Test</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}
</style>
</head>
<body>

<h2>Testing WebGL...</h2>

<script>
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gl = canvas.getContext("webgl");

if(!gl){
  document.body.innerHTML = "<h1 style='color:red'>WebGL NOT Supported</h1>";
}else{
  document.body.innerHTML = "<h1 style='color:lime'>WebGL Supported ✔</h1>";
}
</script>

</body>
</html>
