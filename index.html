<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChemNova Virtual Chemistry Lab</title>
<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
h1{color:#38bdf8;}
input,button{
  margin:8px;
  padding:8px;
  font-size:16px;
}
#flask{
  width:140px;
  height:170px;
  margin:20px auto;
  background:red;
  border-radius:0 0 70px 70px;
  transition:0.5s;
}
</style>
</head>
<body>

<h1>ChemNova Virtual Chemistry Lab</h1>
<p>Developed by Anga Peter Inalegwu</p>

<h2>Strong Acid – Strong Base Titration</h2>

<label>Acid Molarity (M):</label>
<input id="acidM" value="0.1">

<label>Base Molarity (M):</label>
<input id="baseM" value="0.1">

<br>

<button onclick="startExperiment()">Start Experiment</button>

<div id="labArea" style="display:none;">
  <div id="flask"></div>
  <p id="volumeInfo">Base Volume Added: 0 mL</p>
  <p id="phValue">pH: 1.00</p>
  <button onclick="addDrop()">Add 1 mL NaOH</button>
  <button onclick="resetLab()">Reset</button>
</div>

<script>
let acidVolume = 50; // mL
let baseVolume = 0;

function startExperiment(){
  baseVolume = 0;
  document.getElementById("labArea").style.display="block";
  calculatePH();
}

function addDrop(){
  baseVolume += 1;
  calculatePH();
}

function calculatePH(){
  let acidM = parseFloat(document.getElementById("acidM").value);
  let baseM = parseFloat(document.getElementById("baseM").value);

  let nAcid = acidM * (acidVolume/1000);
  let nBase = baseM * (baseVolume/1000);
  let totalVolume = (acidVolume + baseVolume)/1000;

  let ph;

  if(nBase < nAcid){
    let H = (nAcid - nBase) / totalVolume;
    ph = -Math.log10(H);
  }
  else if(nBase === nAcid){
    ph = 7;
  }
  else{
    let OH = (nBase - nAcid) / totalVolume;
    let pOH = -Math.log10(OH);
    ph = 14 - pOH;
  }

  if(ph > 14) ph = 14;
  if(ph < 0) ph = 0;

  document.getElementById("volumeInfo").innerText =
    "Base Volume Added: " + baseVolume + " mL";

  document.getElementById("phValue").innerText =
    "pH: " + ph.toFixed(2);

  if(ph > 8){
    document.getElementById("flask").style.background="pink";
  } else {
    document.getElementById("flask").style.background="red";
  }
}

function resetLab(){
  baseVolume = 0;
  document.getElementById("labArea").style.display="none";
}
</script>

</body>
</html>
